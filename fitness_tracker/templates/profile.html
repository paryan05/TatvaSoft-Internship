{% extends 'base.html' %}
{% block title %}Profile - Fitness{% endblock %}
{% block content %}
<h2>Profile</h2>
<form method="post" class="col-md-6">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ user.name }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Daily Calorie Goal</label>
    <input name="daily_calorie_goal" type="number" class="form-control" value="{{ user.daily_calorie_goal }}" min="0" />
  </div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
