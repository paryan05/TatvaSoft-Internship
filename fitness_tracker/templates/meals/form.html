{% extends 'base.html' %}
{% block title %}{{ 'Edit' if meal else 'Add' }} Meal - Fitness{% endblock %}
{% block content %}
<h2>{{ 'Edit' if meal else 'Add' }} Meal</h2>
<form method="post">
  <div class="row">
    <div class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input name="name" class="form-control" value="{{ meal.name if meal }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Calories</label>
        <input name="calories" type="number" class="form-control" value="{{ meal.calories if meal }}" min="0" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Protein (g)</label>
        <input name="protein_g" type="number" class="form-control" value="{{ meal.protein_g if meal }}" min="0" />
      </div>
      <div class="mb-3">
        <label class="form-label">Carbs (g)</label>
        <input name="carbs_g" type="number" class="form-control" value="{{ meal.carbs_g if meal }}" min="0" />
      </div>
      <div class="mb-3">
        <label class="form-label">Fat (g)</label>
        <input name="fat_g" type="number" class="form-control" value="{{ meal.fat_g if meal }}" min="0" />
      </div>
      <div class="mb-3">
        <label class="form-label">Date</label>
        <input name="date" type="date" class="form-control" value="{{ meal.date if meal }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control">{{ meal.notes if meal }}</textarea>
      </div>
      <button class="btn btn-primary">Save</button>
      <a href="/meals" class="btn btn-secondary">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
