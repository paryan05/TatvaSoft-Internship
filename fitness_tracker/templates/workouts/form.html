{% extends 'base.html' %}
{% block title %}{{ 'Edit' if workout else 'Add' }} Workout - Fitness{% endblock %}
{% block content %}
<h2>{{ 'Edit' if workout else 'Add' }} Workout</h2>
<form method="post">
  <div class="row">
    <div class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Title</label>
        <input name="title" class="form-control" value="{{ workout.title if workout }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Type</label>
        <input name="type" class="form-control" value="{{ workout.type if workout }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Duration (minutes)</label>
        <input name="duration_min" type="number" class="form-control" value="{{ workout.duration_min if workout }}" min="0" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Calories burned</label>
        <input name="calories_burned" type="number" class="form-control" value="{{ workout.calories_burned if workout }}" min="0" />
      </div>
      <div class="mb-3">
        <label class="form-label">Date</label>
        <input name="date" type="date" class="form-control" value="{{ workout.date if workout }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control">{{ workout.notes if workout }}</textarea>
      </div>
      <button class="btn btn-primary">Save</button>
      <a href="/workouts" class="btn btn-secondary">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
